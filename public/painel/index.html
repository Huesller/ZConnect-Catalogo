<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel Comercial | Z Automotiva</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0d10;
      color: #f4f6f8;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .topbar {
      margin-bottom: 25px;
    }

    .topbar strong {
      display: block;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .topbar span {
      color: #8e98a3;
      font-size: 14px;
    }

    .card {
      background: #12161b;
      border: 1px solid #252c34;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #929ca7;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #cbd2d9;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #303943;
      background: #0c1014;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #287cff;
    }

    .field {
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .primary {
      width: 100%;
      background: #1769ff;
      color: white;
    }

    .primary:hover {
      background: #0f5be0;
    }

    .primary:disabled {
      opacity: .6;
      cursor: wait;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-url {
      background: #080b0e;
      border: 1px solid #29313a;
      border-radius: 9px;
      padding: 12px;
      word-break: break-all;
      margin: 15px 0;
      color: #80b3ff;
    }

    .result-info {
      color: #aeb7c0;
      font-size: 14px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .secondary {
      background: #252c34;
      color: #fff;
    }

    .error {
      display: none;
      background: #35171a;
      border: 1px solid #693136;
      color: #ffb7bd;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 18px;
    }

    .error.show {
      display: block;
    }

    .seller-badge {
      display: inline-block;
      background: #17243a;
      border: 1px solid #29466f;
      color: #83b4ff;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="topbar">
    <strong>Painel Comercial | Z Automotiva</strong>
    <span>Ferramenta interna para geração de condições especiais</span>
  </div>

  <div class="card">

    <div class="seller-badge" id="sellerBadge">
      Carregando vendedor...
    </div>

    <h1>Gerar condição especial</h1>

    <p class="subtitle">
      Gere um link individual para o cliente com a condição comercial definida.
    </p>

    <div id="error" class="error"></div>

    <form id="offerForm">

      <div class="field">
        <label for="clientName">Cliente</label>
        <input
          id="clientName"
          type="text"
          placeholder="Nome do cliente"
          autocomplete="off"
          required
        >
      </div>

      <div class="grid">

        <div class="field">
          <label for="discount">Desconto adicional</label>
          <input
            id="discount"
            type="number"
            min="0"
            max="50"
            step="0.01"
            value="0"
          >
        </div>

        <div class="field">
          <label for="validity">Validade</label>
          <select id="validity">
            <option value="1">1 dia</option>
            <option value="3">3 dias</option>
            <option value="7" selected>7 dias</option>
            <option value="15">15 dias</option>
            <option value="30">30 dias</option>
            <option value="permanent">Permanente — sem vencimento automático</option>
          </select>
        </div>

      </div>

      <button class="primary" id="submitButton" type="submit">
        Gerar link
      </button>

    </form>

  </div>

  <div class="card result" id="result">

    <h1>Link gerado</h1>

    <div class="result-info" id="resultInfo"></div>

    <div class="result-url" id="resultUrl"></div>

    <div class="actions">
      <button class="secondary" id="copyButton">
        Copiar link
      </button>

      <button class="secondary" id="openButton">
        Abrir link
      </button>
    </div>

  </div>

</div>

<script>
(function () {

  'use strict';

  /*
   * IMPORTANTE:
   * Como o painel agora ficará dentro do próprio domínio,
   * usamos o domínio atual para chamar a API.
   */

  var CATALOG_URL = window.location.origin + '/';
  var OFFER_API_URL = '/api/offer';

  /*
   * Vendedores disponíveis.
   *
   * A URL define automaticamente qual vendedor está usando
   * o painel.
   */

  var SELLERS = {
    gabriel: {
      id: 'gabriel',
      name: 'Gabriel Zatt',
      baseDiscount: 48
    },

    ney: {
      id: 'ney',
      name: 'Ney',
      baseDiscount: 45
    },

    huesller: {
      id: 'huesller',
      name: 'Huesller',
      baseDiscount: 50
    },

    representante: {
      id: 'representante',
      name: 'representante',
      baseDiscount: 50
    },

    representante1: {
      id: 'representante1',
      name: 'representante1',
      baseDiscount: 50
    },

    representante2: {
      id: 'representante2',
      name: 'representante2',
      baseDiscount: 50
    },

    francisco: {
      id: 'francisco',
      name: 'Francisco',
      baseDiscount: 50
    }
  };

  /*
   * Lê o vendedor da URL.
   *
   * Exemplos:
   *
   * /painel/gabriel
   * /painel/ney
   * /painel/huesller
   * /painel/francisco
   */

  function getSellerId() {

    var path = window.location.pathname
      .replace(/^\/+|\/+$/g, '');

    var parts = path.split('/');

    var sellerId = parts[parts.length - 1];

    /*
     * Se estiver apenas em /painel/,
     * usamos Gabriel temporariamente.
     */

    if (!sellerId || sellerId === 'painel') {
      sellerId = 'gabriel';
    }

    return sellerId.toLowerCase();
  }

  function getSeller() {

    var sellerId = getSellerId();

    return SELLERS[sellerId] || SELLERS.gabriel;
  }

  var seller = getSeller();

  var form = document.getElementById('offerForm');
  var clientEl = document.getElementById('clientName');
  var discountEl = document.getElementById('discount');
  var validityEl = document.getElementById('validity');
  var submitButton = document.getElementById('submitButton');

  var sellerBadge = document.getElementById('sellerBadge');

  var errorEl = document.getElementById('error');

  var resultEl = document.getElementById('result');
  var resultInfoEl = document.getElementById('resultInfo');
  var resultUrlEl = document.getElementById('resultUrl');

  var copyButton = document.getElementById('copyButton');
  var openButton = document.getElementById('openButton');

  var currentUrl = '';

  sellerBadge.textContent = 'Consultor: ' + seller.name;

  function showError(message) {

    errorEl.textContent = message;
    errorEl.classList.add('show');

  }

  function hideError() {

    errorEl.textContent = '';
    errorEl.classList.remove('show');

  }

  function getExtraDiscount() {

    var value = Number(discountEl.value || 0);

    if (!Number.isFinite(value)) {
      return 0;
    }

    return Math.max(0, Math.min(50, value));

  }

  async function registerShortOffer(details) {

    var response = await fetch(OFFER_API_URL, {
      method: 'POST',

      headers: {
        'Content-Type': 'application/json;charset=UTF-8'
      },

      body: JSON.stringify(details)
    });

    var result = await response
      .json()
      .catch(function () {
        return {};
      });

    if (!response.ok || !result.ok) {

      var error = new Error(
        result.error || 'Não foi possível registrar o link.'
      );

      error.code = response.status;

      throw error;
    }

    return result;
  }

  form.addEventListener('submit', async function (event) {

    event.preventDefault();

    hideError();

    var clientName = String(
      clientEl.value || ''
    )
      .trim()
      .replace(/\s+/g, ' ');

    if (!clientName) {

      showError('Informe o nome do cliente.');

      clientEl.focus();

      return;
    }

    var discount = getExtraDiscount();

    var permanent =
      validityEl.value === 'permanent';

    var validityDays =
      permanent
        ? null
        : Math.max(
            1,
            Math.min(
              30,
              Number(validityEl.value || 7)
            )
          );

    submitButton.disabled = true;
    submitButton.textContent = 'Gerando link...';

    try {

      var result = await registerShortOffer({

        seller: seller.id,

        clientName: clientName,

        discount: discount,

        validityDays: validityDays,

        permanent: permanent

      });

      var serverOffer = result.offer || {};

      if (!serverOffer.shortCode) {
        throw new Error(
          'O servidor não retornou o código da oferta.'
        );
      }

      var url = new URL(
        '/oferta/' +
        encodeURIComponent(
          serverOffer.clientSlug
        ) +
        '/' +
        serverOffer.shortCode,

        CATALOG_URL
      );

      currentUrl = url.href;

      resultUrlEl.textContent = currentUrl;

      var finalDiscount =
        Math.min(
          95,
          seller.baseDiscount + discount
        );

      resultInfoEl.innerHTML =
        '<strong>' +
        seller.name +
        '</strong><br>' +

        'Cliente: ' +
        clientName +
        '<br>' +

        'Desconto final: ' +
        finalDiscount +
        '%<br>' +

        (
          permanent
            ? 'Validade: Permanente — sem vencimento automático'
            : 'Validade: ' +
              validityDays +
              ' dias'
        );

      resultEl.classList.add('show');

      resultEl.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
      });

    } catch (error) {

      console.error(error);

      showError(
        error.message ||
        'Não foi possível gerar o link.'
      );

    } finally {

      submitButton.disabled = false;
      submitButton.textContent = 'Gerar link';

    }

  });

  copyButton.addEventListener(
    'click',
    async function () {

      if (!currentUrl) {
        return;
      }

      try {

        await navigator.clipboard.writeText(
          currentUrl
        );

        copyButton.textContent =
          'Copiado!';

        setTimeout(function () {

          copyButton.textContent =
            'Copiar link';

        }, 1800);

      } catch (error) {

        alert(
          'Não foi possível copiar automaticamente. Copie o link manualmente.'
        );

      }

    }
  );

  openButton.addEventListener(
    'click',
    function () {

      if (currentUrl) {

        window.open(
          currentUrl,
          '_blank'
        );

      }

    }
  );

})();
</script>

</body>
</html>
